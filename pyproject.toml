[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "looplinux"
version = "0.1.0"
description = "Ring: a radial window snapper for Linux, ported from Loop for macOS"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
keywords = ["window-manager", "tiling", "snapping", "x11", "wayland"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Window Managers",
    "Typing :: Typed",
]
# PySide6 must be the distribution package (Arch: pyside6), not the PyPI wheel:
# the overlay loads the system's LayerShellQt plugin, which only fits the
# system Qt. It is therefore not listed here.
dependencies = [
    "jeepney>=0.8",
    "python-xlib>=0.33",
]

[project.scripts]
looplinux = "looplinux.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/looplinux"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "PT", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["jeepney", "jeepney.*", "PySide6", "PySide6.*", "Xlib", "Xlib.*"]
ignore_missing_imports = true

# Distribution builds of PySide6 ship without type stubs.
[[tool.mypy.overrides]]
module = ["looplinux.app", "looplinux.overlay.radial", "looplinux.settings", "looplinux.tray"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
